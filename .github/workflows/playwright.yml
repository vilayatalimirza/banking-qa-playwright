name: playwright

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '30 2 * * *' # nightly, 08:00 IST
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate the visual baselines on Linux and upload them as an artifact'
        type: boolean
        default: false

# The demo site is shared and rate-limited: never run two pipelines against it at the same time.
concurrency:
  group: parabank-demo
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: 'true'
  BASE_URL: ${{ vars.BASE_URL || 'https://parabank.parasoft.com/parabank/' }}

jobs:
  unit:
    name: typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npx playwright test -c playwright.ci.config.ts --project=chromium tests/unit

  suite:
    name: full suite (Chromium, \${{ matrix.module }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Each test module gets its own job, but only one module may use the shared demo at a time.
      max-parallel: 1
      matrix:
        include:
          - module: e2e
            test_path: tests/e2e
          - module: contract
            test_path: tests/contract
          - module: api
            test_path: tests/api
          - module: hybrid
            test_path: tests/hybrid
          - module: negative
            test_path: tests/negative
          - module: resilience
            test_path: tests/resilience
          - module: security
            test_path: tests/security
          - module: accessibility
            test_path: tests/a11y
          - module: compliance
            test_path: tests/compliance
    env:
      PW_BLOB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: run module sequentially
        run: npx playwright test -c playwright.ci.config.ts --project=chromium --workers=1 --retries=0 "\${{ matrix.test_path }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-\${{ matrix.module }}
          path: |
            blob-report/
            findings/observations.jsonl
            test-results/
          retention-days: 14
  report:
    name: merge shards, traceability, audit evidence
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: shards
      - name: merge blobs into one report
        run: |
          mkdir -p all-blobs test-results findings
          find shards -path '*blob-report/*.zip' -exec cp {} all-blobs/ \;
          cat $(find shards -name observations.jsonl) > findings/observations.jsonl 2>/dev/null || true
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/results.json PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-results/junit.xml npx playwright merge-reports --reporter=json,junit,html all-blobs
      - name: run metrics (first attempt and final outcomes)
        run: npx tsx scripts/run-metrics.ts test-results/results.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: job summary (requirements, defects, findings)
        run: |
          npx tsx scripts/traceability.ts --results test-results/results.json --out test-results/traceability-full.md
          cat test-results/traceability-full.md >> "$GITHUB_STEP_SUMMARY"
          npx tsx scripts/defect-register.ts >> "$GITHUB_STEP_SUMMARY"
          npx tsx scripts/summarize-findings.ts >> "$GITHUB_STEP_SUMMARY" || true
      - name: build audit-evidence bundle
        run: npx tsx scripts/evidence-bundle.ts --no-attachments
      - uses: actions/upload-artifact@v4
        with:
          name: audit-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: merged-test-report
          path: |
            playwright-report/
            test-results/run-metrics.md
            test-results/traceability-full.md
          retention-days: 14

  cross-browser:
    name: smoke (${{ matrix.project }})
    needs: [suite]
    if: always() # Still collect independent browser smoke evidence when the Chromium suite has failures.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [firefox-smoke, webkit-smoke, mobile-smoke]
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test -c playwright.ci.config.ts --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  visual:
    name: visual regression
    needs: [cross-browser]
    if: always() # Keep visual evidence available even when a browser smoke project fails.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Until Linux baselines are committed this job would always fail, so it is advisory by default.
    continue-on-error: ${{ !inputs.update_snapshots }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: compare with baselines
        if: ${{ !inputs.update_snapshots }}
        run: npx playwright test -c playwright.ci.config.ts --project=visual
      - name: regenerate baselines
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test -c playwright.ci.config.ts --project=visual --update-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-${{ inputs.update_snapshots && 'baselines' || 'report' }}
          path: |
            tests/visual/
            playwright-report/
            test-results/
          retention-days: 14
