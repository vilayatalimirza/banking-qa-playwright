name: E2E module

on:
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'pages/RegisterPage.ts'
      - 'fixtures/index.ts'
      - 'data/factories.ts'
      - '.github/workflows/e2e-module.yml'
  workflow_dispatch:

permissions:
  contents: read

# Share the lock with every ParaBank workflow.
concurrency:
  group: parabank-demo
  cancel-in-progress: false

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch'
    name: E2E module (Chromium, sequential)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: TypeScript compile
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:unit
      - name: E2E tests
        run: npx playwright test -c playwright.ci.config.ts --project=chromium --workers=1 --retries=0 tests/e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-module-results
          path: |
            test-results/
            findings/
          if-no-files-found: ignore
          retention-days: 14
