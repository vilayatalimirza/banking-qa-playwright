name: API transfer edge-case repro

on:
  pull_request:
    paths:
      - '.github/workflows/api-module.yml'
      - 'tests/api/transfer-api.spec.ts'
      - 'fixtures/index.ts'
      - 'fixtures/api.ts'
      - 'pages/RegisterPage.ts'
  workflow_dispatch:

permissions:
  contents: read

# Share the lock with every ParaBank workflow.
concurrency:
  group: parabank-demo
  cancel-in-progress: false

jobs:
  api-transfer-edge-cases:
    name: API transfer edge cases (Chromium, sequential)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: TypeScript compile
        run: npx tsc --noEmit
      - name: Run only the three previously blocked API tests
        run: >-
          npx playwright test -c playwright.ci.config.ts
          --project=chromium --workers=1 --retries=0
          --grep "transfer from a non-existent account is refused|transfer to a non-existent account does not debit the source|transfer without an amount is refused"
          tests/api/transfer-api.spec.ts
      - name: Upload API edge-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-transfer-edge-case-results
          path: |
            test-results/
            findings/
          if-no-files-found: ignore
          retention-days: 14
